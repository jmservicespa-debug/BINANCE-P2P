[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jmcambios-p2p"
version = "0.1.0"
description = "Agente de análisis y posicionamiento Binance P2P USDT/COP — JM Cambios"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
jmcambios-verify = "jmcambios.tools.verify_integration:main"
jmcambios-monitor = "jmcambios.tools.monitor_cli:main"
jmcambios-history = "jmcambios.tools.history_cli:main"
jmcambios-negocio = "jmcambios.tools.business_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
