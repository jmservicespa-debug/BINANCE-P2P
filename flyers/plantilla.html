<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&family=Open+Sans:wght@700;800&display=block" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1080px;position:relative;overflow:hidden;font-family:Arial,'Liberation Sans',sans-serif;background:#2a0f45}
.photo{position:absolute;left:0;top:0;width:1080px;height:995px;overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover;object-position:50% 40%}
.shade{position:absolute;left:0;top:0;width:1080px;height:995px;
  background:linear-gradient(to bottom,rgba(45,12,80,.70) 0%,rgba(45,12,80,.25) 30%,rgba(45,12,80,.05) 45%,rgba(45,12,80,.35) 62%,rgba(52,18,92,.92) 86%,rgba(69,32,106,1) 100%)}
.logo{position:absolute;left:40px;top:44px;height:88px;padding:4px 18px;background:rgba(255,255,255,.93);border-radius:22px;box-shadow:0 4px 16px rgba(0,0,0,.25)}
.logo img{height:80px}
.badge{position:absolute;right:40px;top:59px;width:330px;height:58px;border-radius:20px;background:rgb(91,42,134);
  display:flex;align-items:center;justify-content:center;gap:14px;color:#fff;font-weight:700;font-size:25px;box-shadow:0 4px 16px rgba(0,0,0,.3)}
.badge svg{width:38px;height:26px;border-radius:3px}
h1{position:absolute;top:170px;left:0;right:0;text-align:center;font-family:'Montserrat';font-weight:900;font-size:68px;line-height:1.02;white-space:nowrap;color:#fff;
  text-shadow:0 4px 0 rgba(75,35,112,.9),0 8px 24px rgba(0,0,0,.45)}
.sub{position:absolute;top:262px;left:0;right:0;text-align:center;color:#fff;font-weight:700;font-size:30px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
.sub2{position:absolute;top:690px;left:0;right:0;text-align:center;color:#fff;font-weight:700;font-size:30px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
.row{position:absolute;top:742px;left:40px;right:40px;display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.d{background:rgba(255,255,255,.93);border:2px solid rgb(201,187,253);border-radius:22px;height:108px;display:flex;align-items:center;gap:12px;padding:0 14px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.d svg{width:68px;height:68px;border-radius:50%;flex:none;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.d b{color:#3b1a5a;font-size:27px}
.pill{position:absolute;top:884px;left:50%;transform:translateX(-50%);width:600px;height:76px;border-radius:38px;background:rgb(93,45,141);border:2px solid rgba(255,255,255,.35);
  display:flex;align-items:center;justify-content:center;gap:16px;color:#fff;font-family:'Open Sans';font-weight:800;font-size:38px;text-shadow:0 2px 2px #000;box-shadow:0 6px 20px rgba(0,0,0,.35)}
.bar{position:absolute;left:0;top:995px;width:1080px;height:71px}
.stripe{position:absolute;left:0;top:1066px;width:1080px;height:14px;display:flex}.stripe i{flex:1}
</style></head><body>
<div class="photo">RIO_SLOT</div><div class="shade"></div>
<div class="logo"><img src="logo.png"></div>
<div class="badge"><svg viewBox="0 0 30 21"><rect width="30" height="21" fill="#009C3B"/><path d="M15 2.5 27.5 10.5 15 18.5 2.5 10.5z" fill="#FFDF00"/><circle cx="15" cy="10.5" r="4.6" fill="#002776"/><path d="M10.6 9.6q4.6-1 8.8 1.6" stroke="#fff" stroke-width=".9" fill="none"/></svg>DESDE BRASIL</div>
<h1>ENVIAMOS DESDE BRASIL</h1>
<div class="sub">Envíos de dinero rápidos y seguros</div>
<div class="sub2">Enviamos a:</div>
<div class="row"><div class="d"><svg viewBox="0 0 100 100"><rect width="100" height="50" fill="#FCD116"/><rect y="50" width="100" height="25" fill="#003893"/><rect y="75" width="100" height="25" fill="#CE1126"/></svg><b>Colombia</b></div><div class="d"><svg viewBox="0 0 100 100"><rect width="100" height="34" fill="#FCE300"/><rect y="33" width="100" height="34" fill="#0033A0"/><rect y="66" width="100" height="34" fill="#CF142B"/><g fill="#fff">STARS</g></svg><b>Venezuela</b></div><div class="d"><svg viewBox="0 0 100 100"><rect width="100" height="50" fill="#fff"/><rect y="50" width="100" height="50" fill="#D52B1E"/><rect width="42" height="50" fill="#0039A6"/><path d="M21 13l3.5 10.8h11.3l-9.2 6.7 3.5 10.8-9.1-6.7-9.2 6.7 3.5-10.8-9.1-6.7h11.3z" fill="#fff"/></svg><b>Chile</b></div><div class="d"><svg viewBox="0 0 100 100"><rect width="100" height="100" fill="#003399"/><g fill="#FFCC00">EUSTARS</g></svg><b>Europa</b></div></div>
<div class="pill">⚡ Pago en minutos</div>
<img class="bar" src="bar2.png">
<div class="stripe"><i style="background:#009C3B"></i><i style="background:#FFDF00"></i><i style="background:#002776"></i></div>
</body></html>
